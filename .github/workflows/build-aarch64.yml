name: Build aarch64-linux

env:
  CACHIX_CACHE: expnix

on:
  workflow_dispatch:

concurrency:
  group: build-aarch64-linux
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build orbvmnix (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#nixosConfigurations.orbvmnix.config.system.build.toplevel
