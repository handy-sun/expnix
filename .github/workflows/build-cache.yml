name: Build cache

env:
  CACHIX_CACHE: expnix

on:
  push:
    branches: [main, "dev*"]
    paths-ignore:
      - "**.md"
      - Justfile
      - .gitignore
      - LICENSE
  workflow_dispatch:

concurrency:
  group: build-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      ## Key the marker on everything that can change a derivation: the lock, the
      ## flake modules, and the encrypted secrets (sops files are hashed into the
      ## system closure). Documentation-only pushes keep the old key and skip.
      - name: Restore successful build marker
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/build-cache-stamp
          key: build-cache-${{ hashFiles('flake.lock', '**/*.nix', 'secrets/**', '.sops.yaml') }}
          lookup-only: true

      - name: Check cache status
        id: compare
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "this tree already has a successful cache build, skipping build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no successful cache build for this tree, will rebuild"
          fi

  build:
    needs: check-changes
    ## workflow_dispatch always builds so the cache can be forced from the UI.
    if: needs.check-changes.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nixwsl (x86_64-linux)
            os: ubuntu-latest
            attr: nixosConfigurations.nixwsl.config.system.build.toplevel
          - name: handyMini (aarch64-darwin)
            os: macos-latest
            attr: darwinConfigurations.handyMini.config.system.build.toplevel
          - name: buking (x86_64-linux)
            os: ubuntu-latest
            attr: nixosConfigurations.buking.config.system.build.toplevel
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#${{ matrix.attr }}

  save-hash:
    needs: [check-changes, build]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch /tmp/build-cache-stamp
      - uses: actions/cache/save@v4
        with:
          path: /tmp/build-cache-stamp
          key: build-cache-${{ hashFiles('flake.lock', '**/*.nix', 'secrets/**', '.sops.yaml') }}
