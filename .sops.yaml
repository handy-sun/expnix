creation_rules:
  ## buking and reinsvps deploy the same age key; one rule covers both.
  - path_regex: secrets/hosts/(buking|reinsvps)/.*$
    age: >-
      age1jf4luvktqylgdyrf46w3hk78966mg8p4hag3w82zzwspgaplvvzqludadh
  ## txsh011 carries its own key.
  - path_regex: secrets/hosts/txsh011/.*$
    age: >-
      age1kavcjehdy7nvlvnx8yqt8hl6nx8n9v3evatezw54vgqfyjpla39s225dxl
  ## Root-level shared secrets (beszel-agent.env, mhm-subs, sb-subs): the
  ## shared buking/reinsvps key, plus txsh011.
  - path_regex: secrets/.*$
    age: >-
      age1jf4luvktqylgdyrf46w3hk78966mg8p4hag3w82zzwspgaplvvzqludadh,
      age1kavcjehdy7nvlvnx8yqt8hl6nx8n9v3evatezw54vgqfyjpla39s225dxl
